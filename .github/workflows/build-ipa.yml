name: Build NEXUS Diamantes IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Compilar aplicación iOS
        run: |
          xcodebuild \
            -project NexusDiamantes.xcodeproj \
            -scheme NexusDiamantes \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NexusDiamantes.app Payload/
          zip -qry NEXUS_DIAMANTES_unsigned.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_DIAMANTES_unsigned
          path: NEXUS_DIAMANTES_unsigned.ipa
